<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>キャラクター色相環ソート</title>
<meta name="description" content="自分が作成したTRPGキャラクターを色相環とタグで眺める、個人用のキャラクターアーカイブ" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

<div class="app-shell">
  <header class="app-header">
    <div class="app-title-block">
      <h1 class="app-title">キャラクター色相環ソート</h1>
      <button type="button" id="btn-usage-guide" class="app-usage-btn" aria-expanded="false">💡 使い方を見る <span class="app-usage-btn-arrow" aria-hidden="true">▾</span></button>
    </div>
  </header>

  <div class="app-header-actions">
    <button type="button" id="btn-add-character" class="btn btn-primary">＋ 新規キャラクター</button>
    <button type="button" id="btn-save-image" class="btn btn-ghost" title="今表示されている色相環を画像として保存します"><svg class="btn-icon-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span id="btn-save-image-label">色相環を画像で保存</span></button>
    <button type="button" id="btn-export" class="btn btn-ghost" title="今のキャラクターを全部JSONファイルに保存します">バックアップを保存(JSON)</button>
    <button type="button" id="btn-import" class="btn btn-ghost" title="保存したJSONファイルから復元します">バックアップから復元(JSON)</button>
    <input type="file" id="import-file-input" accept="application/json" hidden />
    <button type="button" id="btn-delete-all" class="btn btn-danger btn-small"><svg class="btn-icon-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>全キャラクターを削除</button>
  </div>

  <div id="ug-dropdown" class="ug-dropdown" hidden></div>

  <div class="view-toggle-bar">
    <div class="tag-mode-toggle view-toggle-large" role="group" aria-label="表示切り替え">
      <button type="button" id="btn-view-wheel" class="mode-btn mode-btn-active">🎨 色相環</button>
      <button type="button" id="btn-view-list" class="mode-btn" title="一覧表示でまとめてタグ付けできます">📋 一覧</button>
    </div>
  </div>

  <nav id="tag-bar" class="tag-bar" aria-label="タグで絞り込み"></nav>

  <main class="wheel-main">
    <div id="wheel-stage" class="wheel-stage" aria-label="キャラクター色相環"></div>
    <div id="empty-state" class="empty-state">
      <p>まだキャラクターが登録されていません。</p>
      <button type="button" class="btn btn-primary">最初のキャラクターを追加する</button>
    </div>
    <div id="list-view" class="list-view" aria-label="キャラクター一覧" hidden></div>
  </main>

  <footer class="app-footer">
    <div class="app-footer-top">
      <span id="stats-bar" class="stats-bar"></span>
      <div id="theme-switcher" class="theme-switcher" role="group" aria-label="デザインテーマ"></div>
    </div>
    <div class="footer-notes">
      <p class="footer-notes-title">利用上の注意</p>
      <p class="footer-note">本ツールは、個人が趣味で製作した非公式のTRPG支援ツールです。<br>「いあきゃら」など各サービスの利用規約、立ち絵・キャラクターデータの権利関係については、利用者自身でご確認ください。</p>
      <p class="footer-note">キャラクターのデータは、このブラウザだけに保存されています。<br>別のパソコンやブラウザ、シークレットモードでは見られません。<br>ブラウザの履歴やデータを消すと一緒に消えてしまうので、こまめに「バックアップを保存」しておくと安心です。</p>
    </div>
  </footer>
</div>

<script src="js/utils.js"></script>
<script src="js/color.js"></script>
<script src="js/colorWheel.js"></script>
<script src="js/avatar.js"></script>
<script src="js/db.js"></script>
<script src="js/state.js"></script>
<script src="js/sampleData.js"></script>
<script src="js/iacharaSync.js"></script>
<script src="js/hoverCard.js"></script>
<script src="js/detailModal.js"></script>
<script src="js/usageGuide.js"></script>
<script src="js/characterForm.js"></script>
<script src="js/bulkImport.js"></script>
<script src="js/listView.js"></script>
<script src="js/tagFilter.js"></script>
<script src="js/importExport.js"></script>
<script src="js/wheel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
